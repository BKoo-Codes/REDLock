name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --collect-all streamlit --collect-all altair --collect-all pandas --add-data "app.py;." --add-data "padlock_design;padlock_design" --name PadDx_miR_Tool --clean run_gui.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PadDx_miR_Tool_Windows
        path: dist/PadDx_miR_Tool.exe
