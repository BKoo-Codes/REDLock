name: Build & Release EXE

on:
  push:
    tags:
      - "v*"            # push a tag (v1.0.1 ...) -> builds and publishes a PERMANENT Release
  workflow_dispatch:     # lets you run a test build manually from the Actions tab

permissions:
  contents: write        # required so the workflow can create/update a Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --collect-all streamlit --collect-all altair --collect-all pandas --collect-all Bio --collect-all matplotlib --hidden-import=Bio --hidden-import=Bio.Seq --add-data "app.py;." --add-data "padlock_design;padlock_design" --add-data ".streamlit;.streamlit" --name REDLock_Tool --clean run_gui.py

    # Temporary copy for quick testing (auto-deletes after 7 days) — optional
    - name: Upload test artifact
      uses: actions/upload-artifact@v4
      with:
        name: REDLock_Tool_Windows
        path: dist/REDLock_Tool.exe
        retention-days: 7

    # Permanent download link — only runs when a version tag triggered the workflow
    - name: Publish to Release (never expires)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/REDLock_Tool.exe
